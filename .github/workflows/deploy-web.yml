name: Deploy dashboard web

on:
  workflow_call:
    inputs:
      flavor:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: dashboard-web-${{ inputs.flavor }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Production must have required reviewers configured in GitHub.
    environment: ${{ inputs.flavor }}
    env:
      FLUTTER_VERSION: "3.41.3"
      FLAVOR: ${{ inputs.flavor }}
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      SERVICE_NAME: ${{ vars.CLOUD_RUN_WEB_SERVICE || 'pilah-web' }}
      ARTIFACT_REPO: ${{ vars.ARTIFACT_REPO }}
      WORKLOAD_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
      RUNTIME_SERVICE_ACCOUNT: ${{ vars.RUNTIME_WEB_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate hosting configuration
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          case "$FLAVOR" in
            staging)
              : "${FLY_API_TOKEN:?Set staging FLY_API_TOKEN for pilah-web-staging}"
              ;;
            production)
              required=(PROJECT_ID REGION SERVICE_NAME ARTIFACT_REPO WORKLOAD_PROVIDER DEPLOY_SERVICE_ACCOUNT RUNTIME_SERVICE_ACCOUNT)
              for name in "${required[@]}"; do
                if [ -z "${!name}" ]; then
                  echo "::error::Set production variable $name"
                  exit 1
                fi
              done
              [[ "$PROJECT_ID" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]$ ]]
              [[ "$REGION" =~ ^[a-z]+-[a-z]+[0-9]+$ ]]
              [[ "$SERVICE_NAME" =~ ^[a-z][a-z0-9-]*[a-z0-9]$ ]]
              [[ "$ARTIFACT_REPO" =~ ^[a-z][a-z0-9-]*$ ]]
              [[ "$WORKLOAD_PROVIDER" =~ ^projects/[0-9]+/locations/global/workloadIdentityPools/[^/]+/providers/[^/]+$ ]]
              [[ "$DEPLOY_SERVICE_ACCOUNT" =~ ^[a-z0-9-]+@[a-z0-9-]+\.iam\.gserviceaccount\.com$ ]]
              [[ "$RUNTIME_SERVICE_ACCOUNT" =~ ^[a-z0-9-]+@[a-z0-9-]+\.iam\.gserviceaccount\.com$ ]]
              ;;
            *) echo "::error::Unsupported dashboard environment"; exit 1 ;;
          esac

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Prepare public application environment
        env:
          APP_ENV_FILE: ${{ secrets.APP_ENV_FILE }}
          ENABLE_POSTHOG: ${{ secrets.ENABLE_POSTHOG }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
          POSTHOG_ENVIRONMENT: ${{ secrets.POSTHOG_ENVIRONMENT }}
        run: |
          python3 scripts/prepare_web_env.py "$FLAVOR" .env

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      # Staging already depends on CI verify. Tags get their own verification.
      - name: Verify production tag
        if: inputs.flavor == 'production'
        run: |
          flutter analyze --fatal-infos
          flutter test

      - name: Compute app version
        run: |
          version="$(grep -m1 '^version:' pubspec.yaml | cut -d' ' -f2)-${GITHUB_SHA::7}"
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"

      # --source-maps lets PostHog show the real file and function of an error.
      # The maps are uploaded below and never deployed.
      - name: Build dashboard once
        run: |
          if [ "$FLAVOR" = staging ]; then
            target=lib/main_development.dart
          else
            target=lib/main_production.dart
          fi
          flutter build web --release --source-maps -t "$target" \
            --dart-define=APP_VERSION="$APP_VERSION"
          printf '%s\n' "$GITHUB_SHA" > build/web/revision.txt

      # A failed upload only costs readable stack traces, so it must not stop
      # the deploy. It runs before the maps are removed, and the removal below
      # runs whatever happens here.
      - name: Upload source maps to PostHog
        continue-on-error: true
        env:
          POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
          # Not a secret: the id of the one PostHog project (it is in its URL).
          POSTHOG_CLI_PROJECT_ID: "693641"
        run: |
          if [ -z "$POSTHOG_CLI_API_KEY" ]; then
            echo "::warning::POSTHOG_CLI_API_KEY is not set; source maps were not uploaded."
            exit 0
          fi
          npx --yes @posthog/cli@0.20.1 --host https://us.posthog.com \
            sourcemap process --directory build/web \
            --release-name pilah-web --release-version "$APP_VERSION" \
            --delete-after \
            || echo "::warning::Source map upload to PostHog failed; errors will show minified stack traces."

      - name: Keep source maps out of the deployed files
        if: ${{ always() }}
        run: |
          if [ -d build/web ]; then
            find build/web -name '*.map' -delete
            if find build/web -name '*.map' | grep -q .; then
              echo "::error::Source maps are still in build/web."
              exit 1
            fi
          fi

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-web-${{ inputs.flavor }}-${{ github.sha }}
          path: build/web
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: inputs.flavor == 'staging'

      - name: Deploy Fly staging
        if: inputs.flavor == 'staging'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy --remote-only --config deploy/web/fly.staging.toml
          url=https://pilah-web-staging.fly.dev
          curl --fail --retry 8 --retry-all-errors --retry-delay 5 "$url/health"
          curl --fail --retry 3 --retry-all-errors "$url/" > /dev/null
          echo "Dashboard staging: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Authenticate to Google Cloud
        if: inputs.flavor == 'production'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2
        if: inputs.flavor == 'production'

      - name: Build and push static image
        if: inputs.flavor == 'production'
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          image="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPO}/${SERVICE_NAME}:${GITHUB_SHA}"
          docker build -f deploy/web/Dockerfile -t "$image" .
          docker push "$image"
          echo "IMAGE_URI=$image" >> "$GITHUB_ENV"

      - name: Deploy Cloud Run production and report actual HTTPS URL
        if: inputs.flavor == 'production'
        run: |
          gcloud run deploy "$SERVICE_NAME" \
            --project "$PROJECT_ID" --region "$REGION" \
            --image "$IMAGE_URI" --platform managed --allow-unauthenticated \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" --port 8080 \
            --startup-probe='httpGet.path=/health,httpGet.port=8080' --quiet
          url="$(gcloud run services describe "$SERVICE_NAME" \
            --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')"
          [[ "$url" =~ ^https://[a-z0-9.-]+\.run\.app$ ]]
          curl --fail --retry 8 --retry-all-errors --retry-delay 5 "$url/health"
          curl --fail --retry 3 --retry-all-errors "$url/" > /dev/null
          echo "Dashboard production: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify Firebase preview and publish production routing
        if: inputs.flavor == 'production' && vars.FIREBASE_WEB_ENABLED == 'true'
        run: |
          firebase=(npx --yes firebase-tools@13.35.1)
          preview="$("${firebase[@]}" hosting:channel:deploy production-check \
            --project "$PROJECT_ID" --expires 7d --non-interactive --json)"
          preview_url="$(jq -er '[.result[] | .url] | if length == 1 then .[0] else error("Expected one preview URL") end' <<< "$preview")"
          echo "Firebase preview: $preview_url" >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/check_firebase_web.py "$preview_url" "$GITHUB_SHA"
          "${firebase[@]}" deploy --only hosting --project "$PROJECT_ID" --non-interactive
          live_url="https://$PROJECT_ID.web.app"
          python3 scripts/check_firebase_web.py "$live_url" "$GITHUB_SHA"
          echo "Firebase production: $live_url ($GITHUB_SHA)" >> "$GITHUB_STEP_SUMMARY"
