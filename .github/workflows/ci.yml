# CI — the merge gate for pilah-mobile. Runs on every push and PR. Covers:
#   - format check (dart format, blocking)
#   - analyze (flutter analyze, blocking, error+warning+info severity)
#   - tests (flutter test, blocking, coverage >= 25% via lcov)
#   - pub consistency (pubspec.lock vs pubspec.yaml drift)
#   - Android debug APK build (compile gate for the Gradle/Kotlin/AGP side)
#   - secret scan (gitleaks, full history, blocking)
#   - workflow hygiene (actionlint + shellcheck)
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Matches the local dev SDK (3.38.3 stable). Pin exactly so a new Flutter
  # release can't silently change analyzer/test behavior under the gate.
  FLUTTER_VERSION: "3.38.3"

jobs:
  analyze:
    name: Format, analyze & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Exact-version Flutter via the official versioned runner. `flutter pub get`
      # is cached inside the action (pub cache) so test and build jobs re-resolve
      # without re-downloading packages.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Lockfile drift check: pubspec.yaml changed but pubspec.lock not
      # regenerated (or vice versa). Keeps dependency bumps deliberate.
      - name: Verify lockfile consistency
        run: |
          flutter pub get --enforce-lockfile >/dev/null
          git diff --exit-code pubspec.lock \
            || { echo '::error::pubspec.lock is out of sync with pubspec.yaml — run `flutter pub get` and commit the updated lockfile'; exit 1; }

      # Blocking on the project's configured lints (analysis_options.yaml,
      # flutter_lints). `--fatal-infos` treats style infos as failures too so
      # unformatted/sloppy code can't ride in silently.
      - name: flutter analyze
        run: flutter analyze --fatal-infos

      - name: dart format check
        run: dart format --output=none --set-exit-if-changed .

      # Tests run against the real repo tree. .env is gitignored (it's a
      # runtime asset loaded via flutter_dotenv) so a minimal placeholder is
      # materialized here — tests that touch env keys get sane values.
      - name: Prepare .env for tests
        run: cp .env.example .env

      - name: Run tests with coverage
        run: flutter test --coverage

      # Blocking gate. The suite is young (26% at gate introduction — large
      # feature areas predate it), so the floor starts at 25% and must only
      # move UP as tests are added. Parse the lcov directly: no lcov/genhtml
      # tooling needed on the runner.
      - name: Coverage report (fail under 25%)
        run: |
          pct="$(awk '
            /^DA:/ { found++; split($0, a, ","); if (a[2]+0 > 0) hit++ }
            END { if (found == 0) exit 1; printf "%.1f", 100 * hit / found }
          ' coverage/lcov.info)"
          echo "line coverage: ${pct}%"
          awk -v p="$pct" 'BEGIN { exit (p+0 >= 25 ? 0 : 1) }' \
            || { echo '::error::line coverage '"${pct}"'% is below the 25% gate'; exit 1; }

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: error

  android-build:
    name: Android debug APK build
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # google-services.json is gitignored (Firebase credential). CI builds a
      # debug APK, so a placeholder with the right shape satisfies the Gradle
      # google-services plugin without any real credential.
      - name: Stub google-services.json
        run: |
          cat > android/app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "ci-placeholder",
              "storage_bucket": "ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "com.mobile.pilahapp"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  { "current_key": "AIzaSyCI_PLACEHOLDER_KEY_000000000000000" }
                ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      # Debug APK: compiles Dart (AOT) + Kotlin + Gradle wiring without needing
      # the release keystore (key.properties is gitignored, release signing
      # resolves to null storeFile and only release builds use it).
      - name: Build debug APK
        run: flutter build apk --debug

      # Sanity: the artifact must exist and be a valid zip (APK). Catches
      # "build succeeded" but produced nothing weird.
      - name: Verify APK artifact
        run: |
          apk="$(ls build/app/outputs/flutter-apk/app-debug.apk)"
          test -s "$apk"
          unzip -t "$apk" > /dev/null
          echo "APK OK: $(du -h "$apk" | cut -f1)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    # Gitleaks: scans the full git history for high-entropy strings and known
    # secret patterns. Blocking — a leaked credential must fail the gate.
    # Private repo: run the gitleaks CLI via Docker rather than
    # gitleaks-action (which needs a license for private-repo PR mode).
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        run: |
          docker run --rm -v "$PWD":/repo zricethezav/gitleaks \
            detect --source /repo --no-banner \
            --report-format sarif --report-path /repo/gitleaks.sarif

      - name: Attach gitleaks SARIF (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          if-no-files-found: warn

  workflow-hygiene:
    name: Workflow hygiene
    runs-on: ubuntu-latest
    # Lints the CI workflow files themselves (syntax, expression misuse,
    # invalid action inputs, shell script issues inside run blocks).
    steps:
      - uses: actions/checkout@v4

      - name: actionlint
        run: docker run --rm -v "$PWD":/repo -w /repo rhysd/actionlint:latest -color