# CI — full-suite PR gate for pilah-mobile. VM tests run in parallel shards;
# their LCOV is merged before the existing coverage gates, then reused by Sonar.
name: CI

on:
  push:
    branches: [main, staging, 'feature/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/staging' }}

env:
  # Matches the repository's `.fvmrc` (3.41.3 stable). Pin exactly so a new
  # Flutter release can't silently change analyzer/test behavior under the gate.
  FLUTTER_VERSION: "3.41.3"

jobs:
  quality:
    if: github.event_name != 'workflow_dispatch'
    name: Format, analyze & workflow checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install workflow test dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      # .env is gitignored but declared as an asset, so analyze needs it present.
      - name: Prepare .env
        run: cp .env.example .env

      # Generated sources are gitignored and must exist for analyze/tests.
      - name: Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      # Scope to Dart source trees; bricks/ contains non-parseable Mustache templates.
      - name: dart format check
        run: dart format --output=none --set-exit-if-changed lib test codegen

      - name: flutter analyze
        run: flutter analyze --fatal-infos

      - name: Dashboard hosting behavior and pipeline safety
        run: python3 -m unittest discover -s scripts/tests -v

      - name: actionlint
        run: docker run --rm -v "$PWD":/repo -w /repo rhysd/actionlint:latest -color

  test_shards:
    if: github.event_name != 'workflow_dispatch'
    name: Test shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Prepare .env
        run: cp .env.example .env

      - name: Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      # Keep the generated DI graph in coverage; the graph test resolves each registration.
      - name: Measure coverage of the generated DI graph
        run: sed -i '/^\/\/ coverage:ignore-file$/d' lib/services/di.config.dart

      - name: Run tests with coverage
        run: flutter test --coverage --total-shards=${{ strategy.job-total }} --shard-index=${{ matrix.shard }}

      - name: Name shard coverage file
        run: mv coverage/lcov.info coverage/lcov-${{ matrix.shard }}.info

      - uses: actions/upload-artifact@v4
        with:
          name: unit-coverage-${{ matrix.shard }}
          path: coverage/lcov-${{ matrix.shard }}.info
          if-no-files-found: error
          retention-days: 1

  browser_tests:
    if: github.event_name != 'workflow_dispatch'
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Prepare .env
        run: cp .env.example .env

      - name: Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Collect browser download coverage
        run: >-
          dart run test --platform chrome
          --dart2js-args=-O0
          --coverage-path=coverage/browser.lcov.info
          test/browser/file_downloader_test.dart

      - name: Run web-specific widget tests
        run: >-
          flutter test --platform chrome
          test/features/authentication/presentation/widgets/google_sign_in_web_button_chrome.dart
          test/report_download_browser_test.dart

      - name: Verify the web dashboard role layout
        run: >-
          flutter test --platform chrome
          --plain-name "web dashboard uses the web default for Pengurus"
          test/features/dashboard/presentation/pages/dashboard_page_test.dart

      - uses: actions/upload-artifact@v4
        with:
          name: browser-coverage
          path: coverage/browser.lcov.info
          if-no-files-found: error
          retention-days: 1

  coverage:
    if: github.event_name != 'workflow_dispatch'
    name: Coverage gates
    needs: [test_shards, browser_tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install coverage tools
        run: python -m pip install --disable-pip-version-check diff-cover==10.6.0

      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y lcov

      - uses: actions/download-artifact@v4
        with:
          pattern: unit-coverage-*
          path: coverage/shards

      - uses: actions/download-artifact@v4
        with:
          name: browser-coverage
          path: coverage

      - name: Merge test coverage shards
        run: |
          tracefiles=(coverage/shards/*/lcov-*.info)
          if [[ ! -e "${tracefiles[0]}" || "${#tracefiles[@]}" -ne 4 ]]; then
            echo "::error::Expected 4 coverage shards, found ${#tracefiles[@]}."
            exit 1
          fi
          lcov_args=()
          for tracefile in "${tracefiles[@]}"; do
            lcov_args+=(--add-tracefile "$tracefile")
          done
          lcov "${lcov_args[@]}" --output-file coverage/lcov.info

      # Keep the existing 25% floor; evaluate it against the merged VM coverage.
      - name: Coverage report (fail under 25%)
        run: |
          # shellcheck disable=SC2016  # the awk program is intentionally single-quoted
          pct="$(awk '
            /^DA:/ { found++; split($0, a, ","); if (a[2]+0 > 0) hit++ }
            END { if (found == 0) exit 1; printf "%.1f", 100 * hit / found }
          ' coverage/lcov.info)"
          echo "line coverage: ${pct}%"
          awk -v p="$pct" 'BEGIN { exit (p+0 >= 25 ? 0 : 1) }' \
            || { echo "::error::line coverage ${pct}% is below the 25% gate"; exit 1; }

      - name: PR diff coverage (fail under 25%)
        if: github.event_name == 'pull_request'
        run: >-
          diff-cover coverage/lcov.info
          --compare-branch=origin/${{ github.base_ref }}
          --fail-under=25
          --total-percent-float
          --show-uncovered

      - uses: actions/upload-artifact@v4
        with:
          name: sonar-coverage
          path: |
            coverage/lcov.info
            coverage/browser.lcov.info
          if-no-files-found: error
          retention-days: 1

  verify:
    if: ${{ always() && github.event_name != 'workflow_dispatch' }}
    name: Format, analyze, tests & build
    needs: [quality, test_shards, browser_tests, coverage]
    runs-on: ubuntu-latest
    steps:
      - name: Require all verification jobs to pass
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_RESULT: ${{ needs.test_shards.result }}
          BROWSER_RESULT: ${{ needs.browser_tests.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
        run: |
          if [[ "$QUALITY_RESULT" != success || "$TEST_RESULT" != success || \
                "$BROWSER_RESULT" != success || "$COVERAGE_RESULT" != success ]]; then
            echo "::error::Quality, test, browser, or coverage validation failed."
            exit 1
          fi

  sonar:
    if: github.event_name != 'workflow_dispatch'
    name: SonarCloud analysis
    needs: coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: sonar-coverage
          path: coverage

      - name: Set up Java 21 (scanner engine)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # SonarCloud intermittently returns 403 during bootstrap; a fresh connection often succeeds.
      - name: SonarCloud Scan
        id: sonar_scan
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=bank-sampah-pilah
            -Dsonar.projectKey=bank-sampah-PILAH_pilah-mobile
            -Dsonar.sources=lib
            -Dsonar.dart.lcov.reportPaths=coverage/lcov.info,coverage/browser.lcov.info
            -Dsonar.coverage.exclusions=lib/main_development.dart,lib/main_production.dart,lib/main_beranda_preview.dart
            -Dsonar.exclusions=**/*.g.dart,**/*.freezed.dart,**/*.mocks.dart,**/generated/**,**/*.gr.dart
            -Dsonar.scanner.skipJreProvisioning=true

      - name: SonarCloud Scan (retry)
        if: steps.sonar_scan.outcome == 'failure'
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=bank-sampah-pilah
            -Dsonar.projectKey=bank-sampah-PILAH_pilah-mobile
            -Dsonar.sources=lib
            -Dsonar.dart.lcov.reportPaths=coverage/lcov.info,coverage/browser.lcov.info
            -Dsonar.coverage.exclusions=lib/main_development.dart,lib/main_production.dart,lib/main_beranda_preview.dart
            -Dsonar.exclusions=**/*.g.dart,**/*.freezed.dart,**/*.mocks.dart,**/generated/**,**/*.gr.dart
            -Dsonar.scanner.skipJreProvisioning=true

  deploy_web_staging:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    uses: ./.github/workflows/deploy-web.yml
    with:
      flavor: staging
    secrets: inherit
    permissions:
      contents: read
      id-token: write

  debug_apk:
    if: github.event_name == 'workflow_dispatch'
    name: Build debug APK artifact
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare .env
        env:
          APP_ENV_FILE: ${{ secrets.APP_ENV_FILE }}
        run: |
          if [ -z "$APP_ENV_FILE" ]; then
            echo "::error::The staging environment secret APP_ENV_FILE is required."
            exit 1
          fi
          printf '%s' "$APP_ENV_FILE" > .env

      - name: Prepare google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::The staging environment secret GOOGLE_SERVICES_JSON is required."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          jq empty android/app/google-services.json

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ci-${{ github.run_number }}-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
