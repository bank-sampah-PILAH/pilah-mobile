name: CD - Production

on:
  push:
    tags:
      - "v*"

concurrency:
  group: cd-production-${{ github.ref }}
  cancel-in-progress: false

env:
  # Keep CD on the same pinned Flutter release as the merge gate.
  FLUTTER_VERSION: "3.38.3"

jobs:
  release:
    name: Build production APK artifact
    runs-on: ubuntu-latest
    # Configure required reviewers on this environment to gate the upload.
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare application environment
        env:
          APP_ENV_FILE: ${{ secrets.APP_ENV_FILE }}
        run: |
          if [ -z "$APP_ENV_FILE" ]; then
            echo "::error::The production environment secret APP_ENV_FILE is required."
            exit 1
          fi
          printf '%s' "$APP_ENV_FILE" > .env

      - name: Prepare Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          required_secrets=(
            ANDROID_KEYSTORE_BASE64
            ANDROID_KEY_ALIAS
            ANDROID_KEY_PASSWORD
            ANDROID_KEYSTORE_PASSWORD
          )
          for secret_name in "${required_secrets[@]}"; do
            if [ -z "${!secret_name}" ]; then
              echo "::error::The production environment secret ${secret_name} is required."
              exit 1
            fi
          done

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode > android/app/upload-keystore.jks
          printf '%s\n' \
            "storePassword=$ANDROID_KEYSTORE_PASSWORD" \
            "keyPassword=$ANDROID_KEY_PASSWORD" \
            "keyAlias=$ANDROID_KEY_ALIAS" \
            "storeFile=upload-keystore.jks" > android/key.properties

      - name: Prepare google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::The production environment secret GOOGLE_SERVICES_JSON is required."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          jq empty android/app/google-services.json

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build signed production APK
        run: flutter build apk --release -t lib/main_production.dart

      - name: Upload production APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-${{ github.run_number }}-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create production release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Using existing production release $RELEASE_TAG."
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi

      - name: Attach production APK to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$RELEASE_TAG" \
            build/app/outputs/flutter-apk/app-release.apk \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      # Google Play upload can be added later when Play Console access and
      # production credentials are available.
