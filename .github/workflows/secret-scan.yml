# Weekly secret scan. Kept off the per-PR gate on purpose (limited Actions
# budget, per the pilah-be CI review): a scan over the full git history only
# matters when new commits land, not on every PR. Runs Monday 01:30 UTC and
# can be triggered manually from the Actions tab.
name: Secret scan

on:
  schedule:
    - cron: "30 1 * * 1"
  workflow_dispatch:

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    # Scans the full git history for high-entropy strings and known secret
    # patterns. Run via Docker rather than gitleaks-action (which needs a
    # license for private-repo PR mode).
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        run: |
          docker run --rm -v "$PWD":/repo zricethezav/gitleaks \
            detect --source /repo --no-banner

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::gitleaks found a secret in the git history. Check the job output above for the finding, remove the secret, and rotate the credential if it was ever pushed."