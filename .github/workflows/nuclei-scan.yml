# Read-only exposure scan of the DEPLOYED Flutter web dashboard with Nuclei: things only
# visible once deployed (leaked build files, source maps, env/config files, headers, TLS).
# The API lives in pilah-be and has its own scan there.
# Three ways in:
#   - ci.yml calls it after a successful staging web deploy (workflow_call), so a bad
#     commit turns red right after it ships. Works from the staging branch.
#   - weekly cron on the default branch (main): catches drift with no deploy.
#   - manual dispatch (needs this file on main): Actions tab -> Nuclei scan -> Run workflow.
# The run goes red on any finding except the KNOWN_NOISE list in the Gate step. It gates
# no PR and never rolls back a deploy; it only flags the commit.
#
# Passive GET requests only. The target is a fixed choice, not a free URL. URLs come from
# repository variables (Settings -> Secrets and variables -> Actions -> Variables):
#   NUCLEI_STAGING_WEB_URL      (required for staging)
#   NUCLEI_PRODUCTION_WEB_URL   (required for production; the Cloud Run URL is generated,
#                                read it from the deploy job summary, do not guess it)
name: Nuclei scan

on:
  schedule:
    # Mondays, off the hour. Staging only.
    - cron: "47 3 * * 1"
  workflow_call:
    inputs:
      environment:
        description: staging or production
        type: string
        default: staging
  workflow_dispatch:
    inputs:
      environment:
        description: Deployed environment to scan
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

jobs:
  nuclei-scan:
    name: Web exposure scan (${{ inputs.environment || 'staging' }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: nuclei-scan-${{ inputs.environment || 'staging' }}
      cancel-in-progress: false
    env:
      NUCLEI_IMAGE: projectdiscovery/nuclei:v3.11.0
      ENVIRONMENT: ${{ inputs.environment || 'staging' }}
      STAGING_WEB_URL: ${{ vars.NUCLEI_STAGING_WEB_URL }}
      PRODUCTION_WEB_URL: ${{ vars.NUCLEI_PRODUCTION_WEB_URL }}
    steps:
      - name: Resolve target
        run: |
          case "$ENVIRONMENT" in
            staging) url="$STAGING_WEB_URL" ;;
            production) url="$PRODUCTION_WEB_URL" ;;
            *) echo "::error::environment must be staging or production, got '$ENVIRONMENT'."; exit 1 ;;
          esac
          case "$url" in
            https://*) ;;
            *) echo "::error::Missing or non-HTTPS web URL for $ENVIRONMENT; set the NUCLEI_${ENVIRONMENT^^}_WEB_URL repository variable."; exit 1 ;;
          esac
          echo "TARGET=$url" >> "$GITHUB_ENV"

      # A scan of an unreachable host finds nothing and would look green.
      - name: Check target is up
        run: |
          code=$(curl -sS -o /dev/null -m 30 -w '%{http_code}' "$TARGET/health" || true)
          echo "$TARGET/health -> $code"
          [ "$code" = "200" ] || { echo "::error::$TARGET is not answering 200 on /health."; exit 1; }

      - name: Fetch templates
        run: |
          mkdir -p nuclei-templates results
          docker run --rm -v "$PWD/nuclei-templates":/root/nuclei-templates \
            "$NUCLEI_IMAGE" -update-templates -duc -nc

      # A curated list, not -tags: tags pull in ~3,300 templates (~7,700 requests, over
      # an hour at a polite rate). These 15 http + 8 ssl templates make ~200 requests and
      # finish in about a minute.
      - name: Scan
        run: |
          http_templates=""
          for t in \
            http/exposures/configs/pubspec-config \
            http/exposures/files/webpack-sourcemap-disclosure \
            http/exposures/files/google-services-json \
            http/exposures/configs/firebase-config-exposure \
            http/exposures/configs/javascript-env-config \
            http/vulnerabilities/generic/generic-env \
            http/exposures/configs/exposed-gitignore \
            http/exposures/configs/git-config \
            http/exposures/configs/exposed-vscode \
            http/exposures/configs/docker-compose-config \
            http/exposures/configs/dockerfile-hidden-disclosure \
            http/misconfiguration/http-missing-security-headers \
            http/misconfiguration/weak-csp-detect \
            http/misconfiguration/csp-script-src-wildcard \
            http/technologies/eol/nginx-eol; do
            http_templates="$http_templates,/root/nuclei-templates/$t.yaml"
          done
          ssl_templates=""
          for t in expired-ssl deprecated-tls weak-cipher-suites insecure-cipher-suite-detect \
                   self-signed-ssl mismatched-ssl-certificate revoked-ssl-certificate \
                   untrusted-root-certificate; do
            ssl_templates="$ssl_templates,/root/nuclei-templates/ssl/$t.yaml"
          done
          run_nuclei() {
            docker run --rm -v "$PWD/nuclei-templates":/root/nuclei-templates \
              -v "$PWD/results":/results "$NUCLEI_IMAGE" \
              -rl 5 -c 3 -timeout 15 -duc -nc -ni -jsonl "$@"
          }
          name="${TARGET#https://}"
          run_nuclei -u "$TARGET" -t "${http_templates#,}" -o "/results/$name-http.jsonl"
          run_nuclei -u "$name:443" -t "${ssl_templates#,}" -o "/results/$name-ssl.jsonl"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Nuclei Web exposure scan ($ENVIRONMENT, read-only)"
            echo
            echo "| Target | Template | Severity | Detail |"
            echo "| --- | --- | --- | --- |"
            for f in results/*.jsonl; do
              [ -s "$f" ] || continue
              jq -r '"| \(.host) | \(.["template-id"]) | \(.info.severity) | \(.["matcher-name"] // (.["extracted-results"] // [] | join(", "))) |"' "$f"
            done
            echo
            echo "Empty table: no findings. Missing-header items are info-level and known."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuclei-results-${{ env.ENVIRONMENT }}
          path: results/
          retention-days: 30
          if-no-files-found: ignore

      # Last, so the summary and artifact exist even when this fails. Gate on the
      # template, not the severity: swagger-api, cors-misconfig and the TLS checks
      # are "info" yet exactly what we want to catch. For a false positive, add its
      # template id to KNOWN_NOISE (and say why in the PR).
      # Known, accepted: http-missing-security-headers (no HSTS, Permissions-Policy, COEP,
      # CORP) and weak-csp-detect (CSP only has frame-ancestors) fire on every run. They
      # are hardening debt, not fixed yet.
      - name: Gate
        run: |
          KNOWN_NOISE='["http-missing-security-headers","weak-csp-detect"]'
          shopt -s nullglob
          files=(results/*.jsonl)
          [ "${#files[@]}" -gt 0 ] || { echo "::error::No scan results were produced."; exit 1; }
          findings=$(jq -r --argjson noise "$KNOWN_NOISE" \
            'select(.["template-id"] as $id | $noise | index($id) | not)
             | "\(.host) \(.["template-id"]) [\(.info.severity)] \(.["matched-at"])"' \
            "${files[@]}")
          if [ -n "$findings" ]; then
            echo "::error::Nuclei findings outside KNOWN_NOISE:"
            echo "$findings"
            exit 1
          fi
          echo "No findings outside KNOWN_NOISE."
