<!DOCTYPE html>
<html lang="id">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <title>PILAH | Beranda</title>
</head>
<body>
  <!-- Required by automatic Passkeys plugin registration, before Flutter starts. -->
  <script src="vendor/passkeys-2.4.0/bundle.js"></script>
  <script>
    if (new URLSearchParams(location.search).has('notification')) {
      sessionStorage.setItem('pilah-notification-open', '1');
      history.replaceState(null, '', location.pathname + location.hash);
    }
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.addEventListener('message', (event) => {
        if (event.data !== 'pilah-notification-open') return;
        sessionStorage.setItem('pilah-notification-open', '1');
        window.dispatchEvent(new Event('pilah-notification-open'));
      });
    }
  </script>
  <script>
    // PostHog replay reads the canvas between frames. WebKit draws on an on-screen
    // WebGL canvas whose buffer is cleared after each frame unless it is preserved,
    // so iOS Safari replays come out blank. Must run before Flutter creates its canvas.
    (() => {
      const original = HTMLCanvasElement.prototype.getContext;
      HTMLCanvasElement.prototype.getContext = function (type, attrs) {
        if (type === 'webgl' || type === 'webgl2' || type === 'experimental-webgl') {
          attrs = Object.assign({}, attrs, { preserveDrawingBuffer: true });
        }
        return original.call(this, type, attrs);
      };
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
