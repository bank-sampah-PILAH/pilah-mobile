server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Flutter's filenames are not content hashes. Revalidate even JS/assets.
    add_header Cache-Control "no-cache" always;
    # Verified in a real browser against the release build. 'unsafe-inline' is for styles
    # only (Flutter's engine and the Google button inject them); scripts stay strict.
    # CanvasKit loads from Google's CDN, hence the gstatic script and wasm entries.
    # Image bytes come from the API and Cloud Storage; *.fly.dev and *.run.app cover both
    # environments' API (a path-free wildcard on the two hosting domains).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://www.gstatic.com/flutter-canvaskit/ https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://*.fly.dev https://*.run.app https://accounts.google.com https://www.gstatic.com https://fonts.gstatic.com https://fonts.googleapis.com https://storage.googleapis.com; frame-src https://accounts.google.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    # Fly and Cloud Run terminate TLS in front of this container and only serve HTTPS.
    # Browsers ignore the header over plain HTTP. No includeSubDomains/preload: shared hosts.
    add_header Strict-Transport-Security "max-age=2592000" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    gzip on;
    gzip_vary on;
    gzip_types application/javascript application/json application/wasm text/css image/svg+xml;
    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }
    # Hash routes are client-side; missing resources must really be 404.
    location / {
        try_files $uri $uri/ =404;
    }
}
