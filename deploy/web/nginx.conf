server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Flutter's filenames are not content hashes. Revalidate even JS/assets.
    add_header Cache-Control "no-cache" always;
    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }
    # Hash routes are client-side; missing resources must really be 404.
    location / {
        try_files $uri $uri/ =404;
    }
}
